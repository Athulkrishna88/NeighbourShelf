services:
  - type: web
    name: neighbourshelf
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix server && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: neighbourshelf
          property: host
    healthCheckPath: /api/health
    autoDeploy: true
