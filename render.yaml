services:
  - type: web
    name: neighbourshelf
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix server && npm install --prefix client --include=dev && npm --prefix client run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
